name: PR checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The workflow comes from the base branch. Fork code is only data on the
# runner and executes inside a container without runner credentials or caches.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
          # Never execute this checkout directly on the runner.
          allow-unsafe-pr-checkout: true

      - name: Pull test image
        timeout-minutes: 10
        run: docker pull golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea

      - name: Build and test in container
        run: |
          log_token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$log_token"
          trap 'printf "::%s::\n" "$log_token"' EXIT
          docker run --rm --init --interactive \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=2048 --memory=12g --cpus=4 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/source,target=/source,readonly" \
            --env PROXIER_TEST_PATIENCE=10 \
            --env GOTOOLCHAIN=auto \
            --workdir /work --entrypoint /bin/bash \
            golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea -euo pipefail -s <<'CHECKS'
          cp -R /source/. /work/
          go mod download
          go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate
          git diff --exit-code -- '*_templ.go'
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            printf 'Unformatted files:\n%s\n' "$out"
            exit 1
          fi
          go build ./...
          go vet ./...
          make test GOTESTFLAGS=-timeout=60m
          CHECKS

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Pull lint image
        timeout-minutes: 10
        run: docker pull golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481

      - name: Lint in container
        run: |
          log_token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$log_token"
          trap 'printf "::%s::\n" "$log_token"' EXIT
          docker run --rm --init --interactive \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=2048 --memory=12g --cpus=4 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/source,target=/source,readonly" \
            --env GOTOOLCHAIN=auto \
            --workdir /work --entrypoint /bin/bash \
            golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481 -euo pipefail -s <<'CHECKS'
          cp -R /source/. /work/
          go mod download
          golangci-lint run
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          CHECKS
